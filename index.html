<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Binding of Angelo: The Unwashed Dungeon</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        body {
            background-color: #111;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            margin: 0;
            padding: 5px;
            overflow: hidden;
            touch-action: none;
        }
        h1 {
            color: #ff3333;
            margin: 2px 0;
            font-size: 16px;
            text-shadow: 2px 2px #330000;
        }
        .ui {
            font-size: 13px;
            margin: 2px 0;
            font-weight: bold;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 32vh;
            min-height: 220px;
            margin: 4px auto;
            border: 3px solid #ff3333;
            background-color: #1a0a0a;
            box-shadow: 0 0 15px rgba(255, 51, 51, 0.4);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #150808;
        }
        .controls-wrapper {
            display: flex;
            justify-content: space-around;
            width: 100%;
            max-width: 500px;
            margin: 4px auto;
            gap: 5px;
        }
        .control-group {
            background: #222;
            padding: 4px;
            border: 1px solid #00ff66;
            border-radius: 5px;
            flex: 1;
        }
        .control-group h3 {
            margin: 0 0 2px 0;
            font-size: 10px;
            color: #ffff00;
        }
        .pad-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2px;
            justify-items: center;
            max-width: 130px;
            margin: 0 auto;
        }
        button.ctrl-btn {
            background-color: #333;
            color: #00ff66;
            border: 1px solid #00ff66;
            width: 38px;
            height: 38px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Courier New';
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        button.ctrl-btn:active {
            background-color: #00ff66;
            color: #111;
        }
        .instructions {
            font-size: 9px;
            color: #aaa;
            margin-top: 2px;
        }
    </style>
</head>
<body>

    <h1>🧼 THE BINDING OF ANGELO: UNWASHED 🚿</h1>
    <div class="ui">
        Cuori: <span id="hearts">❤️❤️❤️</span> | Punti: <span id="score">0</span> | Stanza: <span id="room">1</span>/5
    </div>

    <div id="game-container">
        <canvas id="gameCanvas" width="600" height="400"></canvas>
    </div>

    <!-- Pulsanti touch interattivi per telefono/tablet -->
    <div class="controls-wrapper">
        <div class="control-group">
            <h3>MOVIMENTO</h3>
            <div class="pad-grid">
                <div></div>
                <button class="ctrl-btn" ontouchstart="setMove('w', true)" ontouchend="setMove('w', false)" onmousedown="setMove('w', true)" onmouseup="setMove('w', false)" onmouseleave="setMove('w', false)">⬆️</button>
                <div></div>
                <button class="ctrl-btn" ontouchstart="setMove('a', true)" ontouchend="setMove('a', false)" onmousedown="setMove('a', true)" onmouseup="setMove('a', false)" onmouseleave="setMove('a', false)">⬅️</button>
                <button class="ctrl-btn" ontouchstart="setMove('s', true)" ontouchend="setMove('s', false)" onmousedown="setMove('s', true)" onmouseup="setMove('s', false)" onmouseleave="setMove('s', false)">⬇️</button>
                <button class="ctrl-btn" ontouchstart="setMove('d', true)" ontouchend="setMove('d', false)" onmousedown="setMove('d', true)" onmouseup="setMove('d', false)" onmouseleave="setMove('d', false)">➡️</button>
            </div>
        </div>
        <div class="control-group">
            <h3>SPARA TERRA</h3>
            <div class="pad-grid">
                <div></div>
                <button class="ctrl-btn" ontouchstart="shoot('ArrowUp')" onclick="shoot('ArrowUp')">⬆️</button>
                <div></div>
                <button class="ctrl-btn" ontouchstart="shoot('ArrowLeft')" onclick="shoot('ArrowLeft')">⬅️</button>
                <button class="ctrl-btn" ontouchstart="shoot('ArrowDown')" onclick="shoot('ArrowDown')">⬇️</button>
                <button class="ctrl-btn" ontouchstart="shoot('ArrowRight')" onclick="shoot('ArrowRight')">➡️</button>
            </div>
        </div>
    </div>

    <div class="instructions">
        Usa i tasti su schermo o la tastiera (WASD + Frecce su PC).
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let gameStarted = true;
        let score = 0;
        let currentRoom = 1;
        const maxRooms = 5;

        let player = {
            x: 50,
            y: 200,
            size: 20,
            speed: 4,
            hearts: 3,
            invulnerable: 0
        };

        let keys = {};
        let projectiles = [];
        let enemies = [];
        let boss = null;
        let upgradeMessage = "";
        let upgradeTimer = 0;

        // Blocco zoom da mobile
        document.addEventListener('gesturestart', (e) => e.preventDefault());
        document.addEventListener('touchmove', (e) => {
            if (e.scale !== 1) e.preventDefault();
        }, { passive: false });

        // Gestione tastiera PC (WASD per muoversi, Frecce per sparare)
        window.addEventListener("keydown", (e) => {
            let key = e.key.toLowerCase();
            if (['w', 'a', 's', 'd'].includes(key)) {
                keys[key] = true;
            }
            if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(key)) {
                e.preventDefault();
                shoot(e.key);
            }
        });

        window.addEventListener("keyup", (e) => {
            let key = e.key.toLowerCase();
            if (['w', 'a', 's', 'd'].includes(key)) {
                keys[key] = false;
            }
        });

        // Gestione pulsanti touch/mouse
        function setMove(dir, isDown) {
            keys[dir] = isDown;
        }

        function shoot(direction) {
            let dx = 0, dy = 0;
            let dirLower = direction.toLowerCase();
            if (dirLower.includes('up')) dy = -7;
            if (dirLower.includes('down')) dy = 7;
            if (dirLower.includes('left')) dx = -7;
            if (dirLower.includes('right')) dx = 7;

            projectiles.push({
                x: player.x,
                y: player.y,
                dx: dx,
                dy: dy,
                size: 6,
                color: '#8B4513'
            });
        }

        function initRoom(roomNum) {
            enemies = [];
            projectiles = [];
            boss = null;

            if (roomNum < maxRooms) {
                let enemyCount = roomNum + 2;
                for (let i = 0; i < enemyCount; i++) {
                    enemies.push({
                        x: 250 + Math.random() * 300,
                        y: 50 + Math.random() * 300,
                        size: 18,
                        type: Math.random() > 0.5 ? 'soap' : 'towel',
                        speed: 1.2 + (roomNum * 0.3),
                        health: 2 + roomNum
                    });
                }
            } else {
                boss = {
                    x: 500,
                    y: 200,
                    size: 35,
                    health: 25,
                    maxHealth: 25,
                    shootTimer: 0
                };
            }
        }

        function checkUpgrade() {
            if (score > 0 && score % 150 === 0) {
                player.speed += 0.8;
                upgradeMessage = "✨ UPGRADE! Velocità aumentata per lo sporco accumulato!";
                upgradeTimer = 120;
            }
        }

        function update() {
            if (!gameStarted) return;

            if (keys['w'] && player.y > player.size) player.y -= player.speed;
            if (keys['s'] && player.y < canvas.height - player.size) player.y += player.speed;
            if (keys['a'] && player.x > player.size) player.x -= player.speed;
            if (keys['d'] && player.x < canvas.width - player.size) player.x += player.speed;

            if (player.invulnerable > 0) player.invulnerable--;

            for (let i = projectiles.length - 1; i >= 0; i--) {
                let p = projectiles[i];
                p.x += p.dx;
                p.y += p.dy;

                if (p.x < 0 || p.x > canvas.width || p.y < 0 || p.y > canvas.height) {
                    projectiles.splice(i, 1);
                    continue;
                }

                let hitEnemy = false;
                for (let j = enemies.length - 1; j >= 0; j--) {
                    let en = enemies[j];
                    let dist = Math.hypot(p.x - en.x, p.y - en.y);
                    if (dist < p.size + en.size && !p.isBossWater) {
                        en.health--;
                        hitEnemy = true;
                        if (en.health <= 0) {
                            enemies.splice(j, 1);
                            score += 50;
                            checkUpgrade();
                        }
                        break;
                    }
                }

                if (boss && !p.isBossWater) {
                    let distBoss = Math.hypot(p.x - boss.x, p.y - boss.y);
                    if (distBoss < p.size + boss.size) {
                        boss.health--;
                        hitEnemy = true;
                        if (boss.health <= 0) {
                            gameStarted = false;
                            alert("VITTORIA! Angelo ha salvato la sua stanza.");
                            location.reload();
                        }
                    }
                }

                if (hitEnemy && !p.isBossWater) {
                    projectiles.splice(i, 1);
                }
            }

            enemies.forEach(en => {
                let angle = Math.atan2(player.y - en.y, player.x - en.x);
                en.x += Math.cos(angle) * en.speed;
                en.y += Math.sin(angle) * en.speed;

                let dist = Math.hypot(player.x - en.x, player.y - en.y);
                if (dist < player.size + en.size && player.invulnerable === 0) {
                    player.hearts--;
                    player.invulnerable = 60;
                    if (player.hearts <= 0) {
                        gameStarted = false;
                        alert("GAME OVER! Angelo è stato lavato.");
                        location.reload();
                    }
                }
            });

            if (boss) {
                boss.shootTimer++;
                if (boss.shootTimer > 45) {
                    boss.shootTimer = 0;
                    let angle = Math.atan2(player.y - boss.y, player.x - boss.x);
                    projectiles.push({
                        x: boss.x,
                        y: boss.y,
                        dx: Math.cos(angle) * 5,
                        dy: Math.sin(angle) * 5,
                        size: 8,
                        color: '#00ffff',
                        isBossWater: true
                    });
                }
            }

            projectiles.forEach((p, index) => {
                if (p.isBossWater) {
                    let dist = Math.hypot(player.x - p.x, player.y - p.y);
                    if (dist < player.size + p.size && player.invulnerable === 0) {
                        player.hearts--;
                        player.invulnerable = 60;
                        projectiles.splice(index, 1);
                        if (player.hearts <= 0) {
                            gameStarted = false;
                            alert("GAME OVER! La doccia ti ha sopraffatto.");
                            location.reload();
                        }
                    }
                }
            });

            if (enemies.length === 0 && !boss) {
                currentRoom++;
                if (currentRoom <= maxRooms) {
                    initRoom(currentRoom);
                }
            }

            if (upgradeTimer > 0) upgradeTimer--;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#331111";
            ctx.fillRect(canvas.width - 20, canvas.height / 2 - 30, 20, 60);

            // Giocatore
            ctx.fillStyle = player.invulnerable % 10 < 5 ? "#8b5a2b" : "#ff9999";
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#fff";
            ctx.fillRect(player.x - 6, player.y - 4, 4, 4);
            ctx.fillRect(player.x + 2, player.y - 4, 4, 4);

            // Nemici
            enemies.forEach(en => {
                ctx.fillStyle = en.type === 'soap' ? "#ff66ff" : "#66a3ff";
                ctx.beginPath();
                ctx.arc(en.x, en.y, en.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = "#fff";
                ctx.font = "9px monospace";
                ctx.fillText(en.type === 'soap' ? "SAPONE" : "ASCIUGA", en.x - 20, en.y - 20);
            });

            // Boss
            if (boss) {
                ctx.fillStyle = "#silver";
                ctx.beginPath();
                ctx.arc(boss.x, boss.y, boss.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = "#00ffff";
                ctx.fillRect(boss.x - 10, boss.y - 15, 20, 30);

                ctx.fillStyle = "#550000";
                ctx.fillRect(boss.x - 30, boss.y - 50, 60, 8);
                ctx.fillStyle = "#00ff66";
                ctx.fillRect(boss.x - 30, boss.y - 50, (boss.health / boss.maxHealth) * 60, 8);
            }

            // Proiettili
            projectiles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });

            if (upgradeTimer > 0) {
                ctx.fillStyle = "#ffff00";
                ctx.font = "12px monospace";
                ctx.fillText(upgradeMessage, 20, 25);
            }

            let heartsStr = "";
            for (let i = 0; i < player.hearts; i++) heartsStr += "❤️";
            document.getElementById("hearts").innerText = heartsStr;
            document.getElementById("score").innerText = score;
            document.getElementById("room").innerText = currentRoom;
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        initRoom(currentRoom);
        loop();
    </script>
</body>
</html>
