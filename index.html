<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Binding of Angelo: The Unwashed Dungeon</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        body {
            background-color: #111;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            margin: 0;
            padding: 5px;
            overflow: hidden;
            touch-action: none;
        }
        h1 {
            color: #ff3333;
            margin: 2px 0;
            font-size: 15px;
            text-shadow: 2px 2px #330000;
        }
        .ui {
            font-size: 12px;
            margin: 2px 0;
            font-weight: bold;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 32vh;
            min-height: 220px;
            margin: 4px auto;
            border: 3px solid #ff3333;
            background-color: #1a0a0a;
            box-shadow: 0 0 15px rgba(255, 51, 51, 0.4);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #150808;
        }
        .controls-wrapper {
            display: flex;
            justify-content: space-around;
            width: 100%;
            max-width: 500px;
            margin: 4px auto;
            gap: 5px;
        }
        .control-group {
            background: #222;
            padding: 4px;
            border: 1px solid #00ff66;
            border-radius: 5px;
            flex: 1;
        }
        .control-group h3 {
            margin: 0 0 2px 0;
            font-size: 10px;
            color: #ffff00;
        }
        .pad-grid {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            margin: 0 auto;
        }
        button.ctrl-btn {
            background-color: #333;
            color: #00ff66;
            border: 1px solid #00ff66;
            width: 46px;
            height: 36px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Courier New';
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        button.ctrl-btn:active {
            background-color: #00ff66;
            color: #111;
        }
        .actions-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 3px;
            height: 100%;
        }
        button.shoot-big-btn {
            background-color: #8B4513;
            color: #fff;
            border: 2px solid #00ff66;
            width: 95px;
            height: 32px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Courier New';
            border-radius: 6px;
        }
        button.shoot-big-btn:active {
            background-color: #00ff66;
            color: #111;
        }
        button.special-big-btn {
            background-color: #9900cc;
            color: #ffff00;
            border: 2px solid #ffff00;
            width: 95px;
            height: 32px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Courier New';
            border-radius: 6px;
        }
        button.special-big-btn:active {
            background-color: #ffff00;
            color: #111;
        }
        .instructions {
            font-size: 9px;
            color: #aaa;
            margin-top: 2px;
        }
    </style>
</head>
<body>

    <h1>🧼 THE BINDING OF ANGELO: 5 MONDI 🚿</h1>
    <div class="ui">
        Cuori: <span id="hearts">❤️❤️❤️</span> | Punti: <span id="score">0</span> | Mondo: <span id="world">1</span>/5 | Stanza: <span id="room">1</span>/7
    </div>

    <div id="game-container">
        <canvas id="gameCanvas" width="600" height="400"></canvas>
    </div>

    <!-- Pulsanti touch interattivi -->
    <div class="controls-wrapper">
        <div class="control-group">
            <h3>MOVIMENTO (SU/GIÙ)</h3>
            <div class="pad-grid">
                <button class="ctrl-btn" ontouchstart="setMove('w', true)" ontouchend="setMove('w', false)" onmousedown="setMove('w', true)" onmouseup="setMove('w', false)" onmouseleave="setMove('w', false)">⬆️</button>
                <button class="ctrl-btn" ontouchstart="setMove('s', true)" ontouchend="setMove('s', false)" onmousedown="setMove('s', true)" onmouseup="setMove('s', false)" onmouseleave="setMove('s', false)">⬇️</button>
            </div>
        </div>
        <div class="control-group">
            <h3>AZIONI</h3>
            <div class="actions-container">
                <button class="shoot-big-btn" ontouchstart="shoot()" onclick="shoot()">SPARA 💩</button>
                <button class="special-big-btn" ontouchstart="shootSpecial()" onclick="shootSpecial()">MEGA 🚽</button>
            </div>
        </div>
    </div>

    <div class="instructions">
        **W/S** muoviti, **Spazio** spara, **E** mossa speciale (Mega Cacca). Upgrade ogni 500 punti!
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let gameStarted = true;
        let score = 0;
        let currentWorld = 1;
        let currentRoom = 1;
        const maxRoomsPerWorld = 7;
        const maxWorlds = 5;

        let player = {
            x: 80,
            y: 200,
            size: 20,
            speed: 4,
            hearts: 3,
            maxHearts: 3,
            invulnerable: 0,
            extraDamage: 0
        };

        let keys = {};
        let projectiles = [];
        let enemies = [];
        let boss = null;
        let upgradeMessage = "";
        let upgradeTimer = 0;
        let lastScoreUpgradeThreshold = 0;

        // Blocco zoom da mobile
        document.addEventListener('gesturestart', (e) => e.preventDefault());
        document.addEventListener('touchmove', (e) => {
            if (e.scale !== 1) e.preventDefault();
        }, { passive: false });

        // Gestione tastiera PC
        window.addEventListener("keydown", (e) => {
            let key = e.key.toLowerCase();
            if (key === 'w' || key === 's') {
                keys[key] = true;
            }
            if (e.code === 'Space') {
                e.preventDefault();
                shoot();
            }
            if (key === 'e') {
                shootSpecial();
            }
        });

        window.addEventListener("keyup", (e) => {
            let key = e.key.toLowerCase();
            if (key === 'w' || key === 's') {
                keys[key] = false;
            }
        });

        function setMove(dir, isDown) {
            keys[dir] = isDown;
        }

        function shoot() {
            projectiles.push({
                x: player.x,
                y: player.y,
                dx: 7,
                dy: 0,
                size: 6,
                damage: 1 + player.extraDamage,
                color: '#8B4513',
                isSpecial: false
            });
        }

        // Mossa Speciale corretta (non blocca più il gioco)
        function shootSpecial() {
            projectiles.push({
                x: player.x,
                y: player.y,
                dx: 9,
                dy: 0,
                size: 16,
                damage: 10,
                color: '#ffcc00',
                isSpecial: true
            });
        }

        function initRoom(worldNum, roomNum) {
            enemies = [];
            projectiles = [];
            boss = null;

            if (roomNum < maxRoomsPerWorld) {
                let enemyCount = 2;
                for (let i = 0; i < enemyCount; i++) {
                    enemies.push({
                        x: 350 + (i * 100) + Math.random() * 50,
                        y: 100 + Math.random() * 200,
                        size: 18,
                        type: Math.random() > 0.5 ? 'soap' : 'towel',
                        speed: 0.7 + (worldNum * 0.15) + (roomNum * 0.05),
                        health: 1 + worldNum
                    });
                }
            } else {
                let bossData = [
                    { name: "SPORE KING (Doccia)", color: "#00ffff", health: 20, speed: 4 },
                    { name: "SHAMPOO TITAN", color: "#ff66ff", health: 26, speed: 5 },
                    { name: "SPONGE TERROR", color: "#ffff00", health: 32, speed: 5 },
                    { name: "BATHTUB BEHEMOTH", color: "#ff9933", health: 38, speed: 6 },
                    { name: "THE ULTIMATE DRAIN", color: "#9900cc", health: 50, speed: 7 }
                ];

                let bInfo = bossData[worldNum - 1];
                boss = {
                    name: bInfo.name,
                    x: 500,
                    y: 200,
                    size: 35,
                    health: bInfo.health,
                    maxHealth: bInfo.health,
                    shootSpeed: bInfo.speed,
                    shootTimer: 0,
                    color: bInfo.color
                };
            }
        }

        function checkScoreUpgrades() {
            if (score >= lastScoreUpgradeThreshold + 500) {
                lastScoreUpgradeThreshold += 500;
                
                let upgradeType = Math.floor(Math.random() * 3);
                if (upgradeType === 0) {
                    player.speed += 0.7;
                    upgradeMessage = "🚀 UPGRADE (500 pts): Velocità aumentata!";
                } else if (upgradeType === 1) {
                    player.extraDamage += 1;
                    upgradeMessage = "💥 UPGRADE (500 pts): Potenza aumentata!";
                } else {
                    player.maxHearts++;
                    player.hearts = player.maxHearts;
                    upgradeMessage = "❤️ UPGRADE (500 pts): Cuore extra!";
                }
                upgradeTimer = 180;
            }
        }

        function update() {
            if (!gameStarted) return;

            if (keys['w'] && player.y > player.size) player.y -= player.speed;
            if (keys['s'] && player.y < canvas.height - player.size) player.y += player.speed;

            player.x = 80;

            if (player.invulnerable > 0) player.invulnerable--;

            // Aggiornamento proiettili con gestione sicura dei loop al contrario
            for (let i = projectiles.length - 1; i >= 0; i--) {
                let p = projectiles[i];
                p.x += p.dx;
                p.y += p.dy;

                // Rimozione se esce dallo schermo
                if (p.x < 0 || p.x > canvas.width || p.y < 0 || p.y > canvas.height) {
                    projectiles.splice(i, 1);
                    continue;
                }

                // Gestione colpi contro i nemici
                let hitSomething = false;
                for (let j = enemies.length - 1; j >= 0; j--) {
                    let en = enemies[j];
                    let dist = Math.hypot(p.x - en.x, p.y - en.y);
                    if (dist < p.size + en.size && !p.isBossWater) {
                        en.health -= p.damage;
                        hitSomething = true;
                        if (en.health <= 0) {
                            enemies.splice(j, 1);
                            score += 50;
                            checkScoreUpgrades();
                        }
                        break;
                    }
                }

                // Gestione colpi contro il boss
                if (boss && !p.isBossWater) {
                    let distBoss = Math.hypot(p.x - boss.x, p.y - boss.y);
                    if (distBoss < p.size + boss.size) {
                        boss.health -= p.damage;
                        hitSomething = true;
                        if (boss.health <= 0) {
                            score += 200;
                            checkScoreUpgrades();
                            if (currentWorld < maxWorlds) {
                                currentWorld++;
                                currentRoom = 1;
                                upgradeMessage = `🏆 MONDO ${currentWorld - 1} COMPLETATO! Si sale al Mondo ${currentWorld}!`;
                                upgradeTimer = 180;
                                initRoom(currentWorld, currentRoom);
                            } else {
                                gameStarted = false;
                                alert("VITTORIA FINALE! Hai completato tutti i 5 mondi e salvato Angelo!");
                                location.reload();
                            }
                        }
                    }
                }

                // Se colpisce qualcosa e NON è speciale, rimuovi il proiettile
                // Se è speciale (Mega), attraversa i normali nemici ma infligge danno senza bloccarsi
                if (hitSomething && !p.isSpecial && !p.isBossWater) {
                    projectiles.splice(i, 1);
                }
            }

            enemies.forEach(en => {
                if (en.x > 200) {
                    en.x -= en.speed * 0.4;
                }
                if (en.y < player.y) en.y += en.speed;
                if (en.y > player.y) en.y -= en.speed;

                let dist = Math.hypot(player.x - en.x, player.y - en.y);
                if (dist < player.size + en.size && player.invulnerable === 0) {
                    player.hearts--;
                    player.invulnerable = 60;
                    if (player.hearts <= 0) {
                        gameStarted = false;
                        alert("GAME OVER! Angelo è stato lavato.");
                        location.reload();
                    }
                }
            });

            if (boss) {
                boss.shootTimer++;
                if (boss.shootTimer > 45) {
                    boss.shootTimer = 0;
                    let angle = Math.atan2(player.y - boss.y, player.x - boss.x);
                    projectiles.push({
                        x: boss.x,
                        y: boss.y,
                        dx: Math.cos(angle) * boss.shootSpeed,
                        dy: Math.sin(angle) * boss.shootSpeed,
                        size: 8,
                        color: boss.color,
                        isBossWater: true
                    });
                }
            }

            projectiles.forEach((p, index) => {
                if (p.isBossWater) {
                    let dist = Math.hypot(player.x - p.x, player.y - p.y);
                    if (dist < player.size + p.size && player.invulnerable === 0) {
                        player.hearts--;
                        player.invulnerable = 60;
                        projectiles.splice(index, 1);
                        if (player.hearts <= 0) {
                            gameStarted = false;
                            alert("GAME OVER! Il boss ti ha sopraffatto.");
                            location.reload();
                        }
                    }
                }
            });

            if (enemies.length === 0 && !boss) {
                currentRoom++;
                if (currentRoom <= maxRoomsPerWorld) {
                    initRoom(currentWorld, currentRoom);
                }
            }

            if (upgradeTimer > 0) upgradeTimer--;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#331111";
            ctx.fillRect(canvas.width - 20, canvas.height / 2 - 30, 20, 60);

            // Giocatore
            ctx.fillStyle = player.invulnerable % 10 < 5 ? "#8b5a2b" : "#ff9999";
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.size, 0, Math.PI * 2);
            ctx.fill();

            // Occhio destro
            ctx.fillStyle = "#fff";
            ctx.beginPath();
            ctx.arc(player.x + 6, player.y, 4, 0, Math.PI * 2);
            ctx.fill();

            // Nemici
            enemies.forEach(en => {
                ctx.fillStyle = en.type === 'soap' ? "#ff66ff" : "#66a3ff";
                ctx.beginPath();
                ctx.arc(en.x, en.y, en.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = "#fff";
                ctx.font = "9px monospace";
                ctx.fillText(en.type === 'soap' ? "SAPONE" : "ASCIUGA", en.x - 20, en.y - 20);
            });

            // Boss
            if (boss) {
                ctx.fillStyle = "#silver";
                ctx.beginPath();
                ctx.arc(boss.x, boss.y, boss.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = boss.color;
                ctx.fillRect(boss.x - 10, boss.y - 15, 20, 30);

                ctx.fillStyle = "#fff";
                ctx.font = "10px monospace";
                ctx.fillText(boss.name, boss.x - 50, boss.y - 45);

                ctx.fillStyle = "#550000";
                ctx.fillRect(boss.x - 30, boss.y - 35, 60, 8);
                ctx.fillStyle = "#00ff66";
                ctx.fillRect(boss.x - 30, boss.y - 35, (boss.health / boss.maxHealth) * 60, 8);
            }

            // Proiettili
            projectiles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });

            if (upgradeTimer > 0) {
                ctx.fillStyle = "#ffff00";
                ctx.font = "10px monospace";
                ctx.fillText(upgradeMessage, 10, 25);
            }

            let heartsStr = "";
            for (let i = 0; i < player.hearts; i++) heartsStr += "❤️";
            document.getElementById("hearts").innerText = heartsStr;
            document.getElementById("score").innerText = score;
            document.getElementById("world").innerText = currentWorld;
            document.getElementById("room").innerText = currentRoom;
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        initRoom(currentWorld, currentRoom);
        loop();
    </script>
</body>
</html>
